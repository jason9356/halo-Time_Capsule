<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{modules/head :: head(null)}"></head>
<body>
<div id="tc-page">
<div class="container">
  <header th:replace="~{modules/header :: header}"></header>

  <section class="category-nav" th:if="${theme.config.layout?.show_category_nav != false}"
           th:with="homeSlugs=${#strings.arraySplit((#strings.isEmpty(theme.config.basic?.home_category_slugs) ? 'yue-du,sui-gan,writing,investing,tech' : theme.config.basic.home_category_slugs), ',')}">
    <div class="sec-label" th:text="${theme.config.labels?.categories ?: '门径'}">门径</div>
    <div class="cat-grid">
      <th:block th:each="slug,iter : ${homeSlugs}" th:if="${iter.count <= 5 and not #strings.isEmpty(#strings.trim(slug))}">
        <th:block th:each="cat : ${categoryFinder.listAsTree()}"
                  th:if="${cat.spec.slug == #strings.trim(slug) or cat.spec.displayName == #strings.trim(slug)}">
          <a class="cat-card" th:href="@{${cat.status.permalink}}">
            <div class="cn" th:text="${#strings.replace(#strings.replace(cat.spec.displayName,'《',''),'》','')}">阅读</div>
            <div class="cc">
              <span th:if="${not #lists.isEmpty(cat.children)}" th:text="${#lists.size(cat.children)} + ' 书卷 · '"></span><span th:text="${cat.postCount ?: 0} + ' 篇'"></span>
            </div>
          </a>
        </th:block>
      </th:block>
    </div>
    <a class="cat-more" th:href="@{${site.routes.categoriesUri}}"
       th:text="${theme.config.labels?.categories_more ?: '更多分类 →'}">更多分类 →</a>
  </section>

  <section class="featured"
           th:with="pinned=${postFinder.list({page:1,size:5,sort:{'spec.pinned,desc','spec.publishTime,desc'}})}"
           th:if="${theme.config.layout?.show_featured != false and not #lists.isEmpty(pinned.items) and pinned.items[0].spec.pinned}">
    <div class="sec-label" th:text="${theme.config.labels?.featured ?: '精华'}">精华</div>
    <a class="featured-item" th:each="post : ${pinned.items}" th:if="${post.spec.pinned}" th:href="@{${post.status.permalink}}">
      <div class="ft" th:text="${post.spec.title}">标题</div>
      <div class="fe" th:text="${post.status.excerpt}">摘要</div>
      <div class="fd" th:text="${#temporals.format(post.spec.publishTime,'yyyy-MM-dd')}">2026-01-01</div>
    </a>
  </section>

  <div class="home-body" th:classappend="${(theme.config.layout == null or theme.config.layout.show_book_wall != false) ? '' : 'no-book-wall'}">
    <div class="home-left" th:if="${theme.config.layout?.show_book_wall != false}"
         th:with="bookSlug=${theme.config.basic?.book_category_slug ?: 'yue-du'}">
      <aside class="book-wall">
        <div class="sec-label" th:text="${theme.config.labels?.book_wall ?: '书单墙'}">书单墙</div>

        <th:block th:each="topCat : ${categoryFinder.listAsTree()}">
          <th:block th:if="${topCat.spec.slug == bookSlug or topCat.spec.displayName == bookSlug}">
            <a class="book-item" th:each="book : ${topCat.children}" th:href="@{${book.status.permalink}}"
               th:with="bookVo=${categoryFinder.getByName(book.metadata.name)},
                        bookTitle=${#strings.replace(#strings.replace(book.spec.displayName,'《',''),'》','')}">
              <span class="bt" th:text="${bookTitle}">书名</span>
              <span class="bc" th:text="${bookVo != null ? bookVo.postCount : (book.postCount ?: 0)}">0</span>
            </a>

            <p class="book-empty" th:if="${#lists.isEmpty(topCat.children)}">
              还没有书。请在「阅读」下新建子分类（一本一子类）。
            </p>

            <a class="book-more" th:href="@{${topCat.status.permalink}}"
               th:text="${theme.config.basic?.book_wall_more ?: '全部书卷 →'}">全部书卷 →</a>
          </th:block>
        </th:block>
      </aside>

      <div th:replace="~{modules/player :: home-panel}"></div>
    </div>

    <section class="post-stream">
      <div class="sec-label" th:text="${theme.config.labels?.latest_posts ?: '最新文章'}">最新文章</div>
      <a class="stream-item" th:each="post : ${posts.items}" th:href="@{${post.status.permalink}}">
        <div class="stream-date">
          <span class="d" th:text="${#temporals.format(post.spec.publishTime,'dd')}">27</span>
          <span class="m" th:text="${#temporals.format(post.spec.publishTime,'MM月')}">07月</span>
        </div>
        <div class="stream-main">
          <div class="st" th:text="${post.spec.title}">标题</div>
          <div class="sx" th:text="${post.status.excerpt}">摘要</div>
          <div class="sm">
            <span th:if="${not #lists.isEmpty(post.categories)}"
                  th:text="${#strings.replace(#strings.replace(post.categories[0].spec.displayName,'《',''),'》','')} + ' · '"></span><span th:text="|阅读 ${post.stats?.visit ?: 0} · 评论 ${post.status?.commentsCount ?: 0}|"></span>
          </div>
        </div>
      </a>
      <div th:replace="~{modules/pagination :: pagination(${posts})}"></div>
    </section>
  </div>

  <footer th:replace="~{modules/footer :: footer}"></footer>
</div>
</div>
<th:block th:replace="~{modules/footer :: scripts}"></th:block>
</body>
</html>
