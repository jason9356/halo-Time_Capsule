<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<header class="site-header" th:fragment="header"
        th:with="sealCustom=${theme.config.brand?.brand_seal},
                 sealSize=${theme.config.brand?.brand_seal_size != null and theme.config.brand.brand_seal_size >= 40 and theme.config.brand.brand_seal_size <= 96 ? theme.config.brand.brand_seal_size : 58}">
  <a class="brand" th:href="@{/}">
    <img class="seal" th:if="${not #strings.isEmpty(sealCustom)}"
         th:src="${sealCustom}"
         th:style="|--seal-size:${sealSize}px|"
         th:alt="${site.title}"
         width="58" height="58" />
    <img class="seal" th:unless="${not #strings.isEmpty(sealCustom)}"
         th:src="@{/assets/img/seal.png}"
         th:style="|--seal-size:${sealSize}px|"
         th:alt="${site.title}"
         width="58" height="58" />
    <div class="brand-text">
      <h1 th:classappend="${theme.config.typography?.brand_lishu == true} ? ' is-lishu' : ''"
          th:text="${site.title}">站点标题</h1>
      <div class="tag" th:if="${not #strings.isEmpty(theme.config.basic?.slogan)}" th:text="${theme.config.basic.slogan}">题记</div>
    </div>
  </a>
  <div class="header-tools">
    <a th:href="@{${site.routes.archivesUri}}" title="归档" aria-label="归档">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </a>
    <button id="theme-toggle" type="button" title="切换明暗" aria-label="切换明暗">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>
</header>
</body>
</html>
