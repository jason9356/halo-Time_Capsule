<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<footer class="site-footer" th:fragment="footer">
  <div class="manifesto" th:if="${not #strings.isEmpty(theme.config.basic?.manifesto)}" th:text="${theme.config.basic.manifesto}">格言</div>
  <div class="copyright">
    &copy; <span th:text="${#temporals.format(#temporals.createNow(),'yyyy')}">2026</span>
    <span th:text="${site.title}">站点</span>
    <th:block th:if="${theme.config.basic?.show_powered_by != false}">
      · Powered by <a href="https://halo.run" target="_blank" rel="noopener">Halo</a>
    </th:block>
    <span th:if="${not #strings.isEmpty(theme.config.basic?.record_number)}" th:text="' · ' + ${theme.config.basic.record_number}"></span>
  </div>
  <div class="footer-links">
    <a th:href="@{/feed.xml}">RSS</a>
    <a th:href="@{${site.routes.archivesUri}}">归档</a>
    <a th:href="@{${site.routes.categoriesUri}}">分类</a>
    <a th:if="${theme.config.layout?.show_footer_tags != false}" th:href="@{${site.routes.tagsUri}}">标签</a>
  </div>
</footer>
<script th:src="@{/assets/js/theme.js?v={v}(v=${theme.spec.version})}"></script>
</body>
</html>
