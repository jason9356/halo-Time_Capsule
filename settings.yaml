apiVersion: v1alpha1
kind: Setting
metadata:
  name: time-capsule-setting
spec:
  forms:
    - group: basic
      label: 基础文案
      formSchema:
        - $formkit: text
          name: seal_char
          label: 顶栏印章字
          help: 站名左侧朱砂印章里的字。留空则自动取站点标题的第一个字
        - $formkit: text
          name: slogan
          label: 站点题记 / 格言
          help: 显示在站点名称下方。站点标题请到「系统设置 → 基本设置」修改
        - $formkit: textarea
          name: manifesto
          label: 页脚格言 / 宣言
          help: 页脚那一句；留空则不显示
        - $formkit: text
          name: archive_desc
          label: 归档页副标题
          value: 按时间回看这一路写下的字。
          help: 归档页标题下方的说明；留空则不显示
        - $formkit: text
          name: book_category_slug
          label: 书单墙：阅读分类别名（slug）
          value: yue-du
          help: 书单墙只列出该一级分类下的子分类（每本书一个子分类）。把文章归进某本书：编辑文章时勾选对应子分类，不要只勾父级。例：分类「阅读」(slug=yue-du) → 子分类「稀罕」→ 文章勾选「稀罕」
        - $formkit: text
          name: book_wall_more
          label: 书单墙底部链接文案
          value: 全部书卷 →
        - $formkit: text
          name: book_count_suffix
          label: 书单页篇数后缀
          value: 篇笔记
          help: 例如显示为「3 篇笔记」
        - $formkit: text
          name: record_number
          label: 备案号
          help: 可选，ICP 备案号，留空则不显示
        - $formkit: checkbox
          name: show_powered_by
          label: 页脚显示 Powered by Halo
          value: true

    - group: labels
      label: 区块标题
      formSchema:
        - $formkit: text
          name: categories
          label: 首页「全部分类」
          value: 全部分类
        - $formkit: text
          name: featured
          label: 首页「精华」
          value: 精华
        - $formkit: text
          name: book_wall
          label: 首页「书单墙」
          value: 书单墙
        - $formkit: text
          name: latest_posts
          label: 首页「最新文章」
          value: 最新文章
        - $formkit: text
          name: tags_title
          label: 标签集合页标题
          value: 全部标签
        - $formkit: text
          name: sidebar_path
          label: 文章侧栏「分类路径」
          value: 分类路径
        - $formkit: text
          name: sidebar_tags
          label: 文章侧栏「标签」
          value: 标签
        - $formkit: text
          name: sidebar_related
          label: 文章侧栏「相关文章」
          value: 相关文章

    - group: layout
      label: 显示开关
      formSchema:
        - $formkit: checkbox
          name: show_category_nav
          label: 首页显示分类导航
          value: true
        - $formkit: checkbox
          name: show_featured
          label: 首页显示精华区（置顶文章）
          value: true
        - $formkit: checkbox
          name: show_book_wall
          label: 首页显示书单墙
          value: true
        - $formkit: checkbox
          name: show_footer_tags
          label: 页脚显示「标签」链接
          value: true

    - group: navidrome
      label: 音乐播放
      formSchema:
        - $formkit: text
          name: base_url
          label: Navidrome 地址
          help: 公网可达的 HTTPS 地址，不含末尾斜杠（如 https://music.example.com）
        - $formkit: text
          name: username
          label: 用户名
          help: 强烈建议使用博客专用只读账号
        - $formkit: text
          name: password
          label: 密码
          help: 仅用于前端 Subsonic token 认证；请务必使用受限只读账号
        - $formkit: text
          name: playlist_id
          label: 歌单 ID
          help: 歌单页 URL 中的 ID
        - $formkit: checkbox
          name: autoplay
          label: 自动播放
          value: false
          help: 默认关闭；访客点击播放键才开始
