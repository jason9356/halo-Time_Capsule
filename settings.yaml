apiVersion: v1alpha1
kind: Setting
metadata:
  name: time-capsule-setting
spec:
  forms:
    - group: brand
      label: 品牌形象
      formSchema:
        - $formkit: attachment
          name: brand_seal
          label: 顶栏方印 / 博客图标
          accepts:
            - "image/png"
            - "image/jpeg"
            - "image/webp"
            - "image/svg+xml"
            - "image/gif"
          help: 仅用于顶栏门楣大图。不上传则用篆书四字印「时间容器」。建议正方形 PNG。文末落款与默认标签页仍用简洁「時」小印。
        - $formkit: number
          name: brand_seal_size
          label: 方印边长（像素）
          value: 58
          min: 40
          max: 96
          help: 默认 58。大屏可略加大到 64–72。
        - $formkit: checkbox
          name: seal_as_favicon
          label: 用主题印章作浏览器标签图标
          value: false
          help: 开启后：若已上传自定义印则用自定义；否则用简洁「時」小印（比四字大印更清晰）。关闭则仍用系统 Favicon。

    - group: basic
      label: 基础文案
      formSchema:
        - $formkit: text
          name: slogan
          label: 站点题记 / 格言
          help: 显示在站点名称下方。站点标题请到「系统设置 → 基本设置」修改
        - $formkit: textarea
          name: manifesto
          label: 页脚格言 / 宣言
          help: 页脚那一句；留空则不显示
        - $formkit: text
          name: archive_desc
          label: 归档页副标题
          value: 按时间回看这一路写下的字。
          help: 归档页标题下方的说明；留空则不显示
        - $formkit: text
          name: moments_desc
          label: 瞬间页说明
          value: 随手记下的碎片。之后可由灵感匣同步到这里。
          help: 显示在瞬间列表标题下方；留空则不显示
        - $formkit: text
          name: book_category_slug
          label: 书单墙：阅读分类别名（slug）
          value: yue-du
          help: 必填。须与后台「文章→分类」里作为书单根的那一级分类的别名完全一致（打开分类编辑可见）。书单墙只显示它下面的子分类；「全部书卷」也跳到这个分类页，不会跳到全站分类。
        - $formkit: text
          name: home_category_slugs
          label: 首页「门径」五个别名（逗号分隔）
          value: yue-du,sui-gan,writing,investing,tech
          help: 按顺序展示：阅读、随感、散文（写作）、交易、技术。须与分类别名一致；留空则用上述默认五门。
        - $formkit: text
          name: book_wall_more
          label: 书单墙底部链接文案
          value: 全部书卷 →
          help: 点击后进入阅读分类页（书单集合），不是全部分类页
        - $formkit: text
          name: book_count_suffix
          label: 书单页篇数后缀
          value: 篇笔记
          help: 例如显示为「3 篇笔记」
        - $formkit: radio
          name: book_chapter_style
          label: 打开某一本书时，篇目怎么显示？
          value: qi
          options:
            - label: 「其一 · 开篇」「其二 · …」（文雅序标 + 你写的短标题）
              value: qi
            - label: 「一 · 开篇」「二 · …」（数字序标 + 短标题）
              value: yi
            - label: 「开篇」（完全用文章标题，不自动加序标）
              value: title
          help: 三种只影响「书」的二级分类页。排序一律按发表时间从早到晚。推荐第一种：标题不必再写书名。
        - $formkit: text
          name: record_number
          label: 备案号
          help: 可选，ICP 备案号，留空则不显示
        - $formkit: checkbox
          name: show_powered_by
          label: 页脚显示 Powered by Halo
          value: true

    - group: labels
      label: 区块标题
      formSchema:
        - $formkit: text
          name: categories
          label: 首页门径区块标题
          value: 门径
          help: 首页五门分类上方的小标题
        - $formkit: text
          name: categories_more
          label: 首页门径「更多」链接文案
          value: 更多分类 →
          help: 链到全部分类页
        - $formkit: text
          name: categories_page_title
          label: 分类集合页标题
          value: 全部分类
        - $formkit: text
          name: featured
          label: 首页「精华」
          value: 精华
        - $formkit: text
          name: book_wall
          label: 首页「书单墙」
          value: 书单墙
        - $formkit: text
          name: latest_posts
          label: 首页「最新文章」
          value: 最新文章
        - $formkit: text
          name: tags_title
          label: 标签集合页标题
          value: 全部标签
        - $formkit: text
          name: sidebar_path
          label: 文章侧栏「分类路径」
          value: 分类路径
        - $formkit: text
          name: sidebar_tags
          label: 文章侧栏「标签」
          value: 标签
        - $formkit: text
          name: sidebar_related
          label: 文章侧栏「相关文章」
          value: 相关文章
        - $formkit: text
          name: moments_title
          label: 瞬间页标题
          value: 瞬间
          help: 需安装并启用 Halo「瞬间」插件；页脚也会显示同名链接

    - group: layout
      label: 显示开关
      formSchema:
        - $formkit: checkbox
          name: show_category_nav
          label: 首页显示分类导航
          value: true
        - $formkit: checkbox
          name: show_featured
          label: 首页显示精华区（置顶文章）
          value: true
        - $formkit: checkbox
          name: show_book_wall
          label: 首页显示书单墙
          value: true
        - $formkit: checkbox
          name: show_footer_tags
          label: 页脚显示「标签」链接
          value: true

    - group: typography
      label: 字体
      formSchema:
        - $formkit: radio
          name: scheme
          id: font_scheme
          key: font_scheme
          label: 字体搭配
          value: library
          options:
            - label: 书卷（默认）— 标题/正文用衬线，界面用无衬线
              value: library
            - label: 全卷 — 标题、正文、界面都用衬线，更沉浸
              value: literary
            - label: 墨韵 — 霞鹜文楷读文 + 无衬线界面（文气优化版）
              value: wenkai
            - label: 编辑器 — 标题与界面用无衬线，正文仍用衬线
              value: editor
            - label: 自定义 — 上传自己的字体文件
              value: custom
          help: 「书卷」为默认推荐。「墨韵」用主题自带霞鹜文楷做标题/正文，字重更松、更适合长文。自定义可上传 woff2/ttf。保存后请硬刷新；升级主题后若选项不变，先点「重载主题配置」。
        - $formkit: checkbox
          name: brand_lishu
          label: 顶栏站名使用隶书
          value: false
          help: 仅作用于「时间容器」等站点标题，正文与列表不变。依赖本机隶书（如华文隶书 / LiSu）；没有则回退到当前标题字体。
        - $formkit: attachment
          name: custom_serif
          label: 衬线字体（标题 + 正文）
          if: "$get(font_scheme).value === 'custom'"
          accepts:
            - "font/woff2"
            - "font/woff"
            - "font/ttf"
            - "font/otf"
            - "application/font-woff2"
            - "application/font-woff"
            - "application/x-font-ttf"
            - "application/vnd.ms-opentype"
          help: 建议上传 .woff2。用于站名、列表标题、文章正文等。
        - $formkit: attachment
          name: custom_sans
          label: 无衬线字体（界面元信息）
          if: "$get(font_scheme).value === 'custom'"
          accepts:
            - "font/woff2"
            - "font/woff"
            - "font/ttf"
            - "font/otf"
            - "application/font-woff2"
            - "application/font-woff"
            - "application/x-font-ttf"
            - "application/vnd.ms-opentype"
          help: 建议 .woff2。用于日期、标签、侧栏小字等。可与衬线上传同一文件。
        - $formkit: text
          name: custom_serif_name
          label: 衬线字体族名（可选）
          if: "$get(font_scheme).value === 'custom'"
          value: TC Serif
          help: 一般保持默认即可。若本机已安装同款字体，可填真实字体名以便优先用本机。
        - $formkit: text
          name: custom_sans_name
          label: 无衬线字体族名（可选）
          if: "$get(font_scheme).value === 'custom'"
          value: TC Sans
          help: 一般保持默认即可。

    - group: navidrome
      label: 音乐播放
      formSchema:
        - $formkit: text
          name: base_url
          label: Navidrome 地址
          help: 推荐填同域反代 https://blog.xybkwd.top/tc-music（无 CORS）。也可填 https://music.xybkwd.top。不要填 http://IP:4533
        - $formkit: text
          name: username
          label: 用户名
          help: 强烈建议使用博客专用只读账号；重载主题配置后若播不了，请把用户名密码重新保存一次
        - $formkit: text
          name: password
          label: 密码
          help: 仅用于前端 Subsonic token 认证；请务必使用受限只读账号
        - $formkit: text
          name: playlist_id
          label: 歌单 ID
          help: Navidrome 打开歌单后，浏览器地址栏里的 id= 后面那一串
        - $formkit: text
          name: section_title
          label: 听乐区标题
          value: 此刻在听
          help: 页脚上方「听乐」区块的标题，用于展示音乐品味
        - $formkit: textarea
          name: section_intro
          label: 听乐区说明
          value: 写字时听的歌，也算一种旁白。
          help: 标题下的一句话；留空则不显示
        - $formkit: checkbox
          name: autoplay
          label: 自动播放
          value: false
          help: 默认关闭；访客点击播放键才开始
